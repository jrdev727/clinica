server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router (ej. /turnos, /pacientes): siempre servir
    # index.html y que el navegador resuelva la ruta del lado del cliente.
    location / {
        try_files $uri /index.html;
    }

    # Todo lo que empiece con /api se manda al backend, que vive en la
    # misma red interna de docker compose bajo el nombre "backend".
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }
}
