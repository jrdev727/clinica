services:
  # Backend: API en Node.js/Express
  - type: web
    name: emuna-clinica-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: DATABASE_URL
        sync: false # cargar a mano: la connection string de Neon
      - key: JWT_SECRET
        generateValue: true # Render genera un valor seguro solo
      - key: PORT
        value: 3000

  # Frontend: sitio estático (build de React/Vite)
  - type: web
    name: emuna-clinica-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://emuna-clinica-backend.onrender.com/api
    routes:
      # Todas las rutas devuelven index.html: React Router maneja la
      # navegación del lado del cliente (ej. /turnos, /pacientes).
      - type: rewrite
        source: /*
        destination: /index.html
